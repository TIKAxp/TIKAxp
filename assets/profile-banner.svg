<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SlayerTIKA — Digital Explorer</title>
  <desc id="desc">A dark futuristic profile banner with animated violet and cyan neon accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A13"/>
      <stop offset="0.55" stop-color="#15122B"/>
      <stop offset="1" stop-color="#090C18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#67E8F9;#C084FC;#A78BFA" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#67E8F9">
        <animate attributeName="stop-color" values="#67E8F9;#C084FC;#A78BFA;#67E8F9" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#A78BFA" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-50%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="610" cy="200" rx="470" ry="210" fill="url(#glow)"/>

  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".8">
    <path d="M48 82V48H82"/><path d="M1118 48h34v34"/>
    <path d="M48 278v34h34"/><path d="M1118 312h34v-34"/>
    <path d="M90 73h130" opacity=".35"/><path d="M980 287h130" opacity=".35"/>
  </g>

  <g fill="#C4B5FD" opacity=".7">
    <circle cx="176" cy="133" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="115" r="2"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="934" cy="225" r="1.5"><animate attributeName="opacity" values=".2;.9;.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="257" r="1.5"><animate attributeName="opacity" values=".9;.2;.9" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="600" y="106" fill="#A78BFA" font-size="13" letter-spacing="6">COLLECTOR  /  EXPLORER  /  LIFELONG LEARNER</text>
    <text x="600" y="190" fill="#F8FAFC" font-size="76" font-weight="800" letter-spacing="5" filter="url(#softGlow)">SLAYERTIKA</text>
    <text x="600" y="238" fill="url(#neon)" font-size="20" font-weight="600" letter-spacing="5">STAY CURIOUS. KEEP EXPLORING.</text>
    <text x="600" y="300" fill="#64748B" font-size="12" letter-spacing="3">DIGITAL FRONTIER  //  VIETNAM</text>
  </g>

  <rect x="250" y="260" width="700" height="1" fill="url(#neon)" opacity=".45"/>
  <rect x="250" y="260" width="150" height="2" fill="url(#neon)" opacity=".9">
    <animate attributeName="x" values="250;800;250" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
